<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#124b9b">
  <meta name="description" content="Informe para quem você procura um cuidador de idosos com a VGR Saúde, em Macapá-AP.">
  <title>VGR Saúde | Perfil do atendimento</title>
  <style>
    :root {
      color-scheme: light;
      --azul-escuro: #172b59;
      --azul: #1454a8;
      --azul-hover: #0e438a;
      --borda: #d5e1f2;
      --texto: #24324a;
      --branco: #ffffff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--branco);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }
    .container { width: 100%; max-width: 560px; margin: auto; }
    .brand {
      margin: 0 0 28px;
      color: var(--azul-escuro);
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .brand > span:first-child { color: var(--azul); }
    .brand .brand-location { display: inline-block; margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--borda); color: #526178; font-size: .78em; font-weight: 600; letter-spacing: 0; vertical-align: middle; }
    h1 {
      margin: 0 0 10px;
      color: var(--azul-escuro);
      text-align: center;
      font-size: clamp(1.6rem, 5vw, 2rem);
      line-height: 1.2;
    }
    .intro { margin: 0 0 26px; color: #526178; text-align: center; font-size: 1rem; }
    .choices { display: grid; gap: 14px; }
    .choice {
      display: flex;
      min-height: 64px;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border: 2px solid var(--azul);
      border-radius: 12px;
      background: var(--azul);
      color: var(--branco);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:hover, .choice:focus-visible { background: var(--azul-hover); border-color: var(--azul-hover); }
    .choice:focus-visible, .modal-close:focus-visible { outline: 3px solid #86b7ff; outline-offset: 3px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(12, 28, 55, .55);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: 100%;
      max-width: 420px;
      padding: 26px 22px 22px;
      border: 1px solid var(--borda);
      border-radius: 14px;
      background: var(--branco);
      box-shadow: 0 16px 42px rgba(11, 36, 75, .2);
      text-align: center;
    }
    .modal h2 { margin: 0 0 12px; color: var(--azul-escuro); font-size: 1.25rem; }
    .modal p { margin: 0 0 22px; font-size: 1rem; }
    .modal-close {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--azul);
      color: var(--branco);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--azul-hover); }
    @media (max-width: 420px) {
      body { padding: 22px 16px; }
      .brand { margin-bottom: 24px; }
      .choice { min-height: 66px; padding: 16px 15px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1527407654978739&amp;ev=PageView&amp;noscript=1" alt=""></noscript>
  <main class="container">
    <p class="brand" aria-label="VGR Saúde, Macapá"><span>VGR</span> Saúde <span class="brand-location">Macapá</span></p>
    <h1>Para quem você procura um cuidador?</h1>
    <p class="intro">Selecione uma opção abaixo.</p>

    <div class="choices" aria-label="Selecione para quem procura atendimento">
      <button class="choice family-option" type="button" data-family="pai" data-message="Olá! Gostaria de informações para contratar um cuidador de idosos para meu pai.">Meu pai</button>
      <button class="choice family-option" type="button" data-family="mãe" data-message="Olá! Gostaria de informações para contratar um cuidador de idosos para minha mãe.">Minha mãe</button>
      <button class="choice family-option" type="button" data-family="outro familiar" data-message="Olá! Gostaria de informações para contratar um cuidador de idosos para outro familiar.">Outro familiar</button>
      <button class="choice" id="job-option" type="button">Estou procurando uma vaga de emprego</button>
    </div>
  </main>

  <div class="modal-backdrop" id="no-vacancies-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <h2 id="modal-title">Obrigado pelo interesse!</h2>
      <p id="modal-message">Agradecemos seu interesse em fazer parte da VGR Saúde! No momento, não temos vagas abertas para cuidadores de idosos.</p>
      <button class="modal-close" id="modal-close" type="button">Fechar</button>
    </section>
  </div>

  <script>
    // META PIXEL: insira abaixo o ID real do Pixel, somente números. Deixe vazio até configurar.
    const META_PIXEL_ID = '1527407654978739';

    // Carrega o Pixel e registra PageView apenas quando um ID válido estiver configurado.
    if (/^\d+$/.test(META_PIXEL_ID)) {
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', META_PIXEL_ID);
      window.fbq('track', 'PageView');
    }

    function trackMetaEvent(eventName, parameters) {
      if (typeof window.fbq === 'function') {
        window.fbq('trackCustom', eventName, parameters || {});
      }
    }

    // IMPORTANTE: insira o número real da empresa apenas com dígitos, incluindo código do país.
    // Exemplo de formato: 55 + DDD + número. Não inclua +, espaços, parênteses ou hífens.
    const WHATSAPP_NUMBER = '5596991963291';

    const modal = document.getElementById('no-vacancies-modal');
    const closeModalButton = document.getElementById('modal-close');
    const jobButton = document.getElementById('job-option');
    let previousFocus = null;

    function openNoVacanciesModal() {
      previousFocus = document.activeElement;
      modal.hidden = false;
      closeModalButton.focus();
    }
    function closeNoVacanciesModal() {
      modal.hidden = true;
      if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
    }

    document.querySelectorAll('.family-option').forEach(function (button) {
      button.addEventListener('click', function () {
        const family = button.dataset.family;
        const message = button.dataset.message;
        // Evento padrão Lead para otimização, somente após escolher uma opção familiar.
        // Também registra o evento personalizado para análise mais detalhada.
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Lead', { content_name: 'IntencaoContratacaoCuidador', familiar: family, origem: 'pagina_perfil' });
        }
        trackMetaEvent('IntencaoContratacaoCuidador', { familiar: family, origem: 'pagina_perfil' });

        // Sem número configurado, não abre um link incorreto: informa como configurar o contato.
        if (!/^\d{10,15}$/.test(WHATSAPP_NUMBER)) {
          window.alert('O WhatsApp da VGR Saúde ainda não foi configurado. Insira o número da empresa no campo WHATSAPP_NUMBER deste arquivo.');
          return;
        }

        const whatsappUrl = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);
        // Pequena espera para permitir que o evento do Pixel seja enviado antes de abrir o WhatsApp.
        window.setTimeout(function () { window.location.href = whatsappUrl; }, typeof window.fbq === 'function' ? 180 : 0);
      });
    });

    jobButton.addEventListener('click', function () {
      trackMetaEvent('CliqueBuscarEmpregoPerfil', { origem: 'pagina_perfil' });
      openNoVacanciesModal();
    });

    closeModalButton.addEventListener('click', closeNoVacanciesModal);
    modal.addEventListener('click', function (event) {
      if (event.target === modal) closeNoVacanciesModal();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !modal.hidden) closeNoVacanciesModal();
    });
  </script>
</body>
</html>
